[project]
name = "take-home"
version = "0.1.0"
description = "Barebones CLI chat agent built on LangChain Deep Agents"
requires-python = ">=3.13"
dependencies = [
    "deepagents",
    "langchain",
    "langchain-openai",
    "langchain-anthropic",
    "langchain-google-genai",
    "python-dotenv",
    "fastapi",
    "uvicorn[standard]",
    "lancedb",
    "tantivy",
    "python-docx",
    "openpyxl",
    "networkx",
    "langchain-text-splitters",
]

[project.scripts]
chat = "agent.cli:main"
serve = "agent.server:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
]

[tool.pytest.ini_options]
testpaths = ["evals"]
filterwarnings = [
    "ignore::DeprecationWarning:lancedb",
]
markers = [
    "slow: marks tests that make LLM API calls (deselect with '-m \"not slow\"')",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent"]
